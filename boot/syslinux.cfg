DEFAULT stripperos
PROMPT 0
TIMEOUT 10

LABEL stripperos
    LINUX /boot/vmlinuz-stripper-rt
    INITRD /boot/initrd.img-stripper-rt
    APPEND root=/dev/ram0 rw console=ttyS0,115200 console=tty0 panic=10 isolcpus=1-31

